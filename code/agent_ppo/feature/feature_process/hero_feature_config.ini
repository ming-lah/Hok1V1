slot0_used_delta         = one_hot:1:eq
slot1_used_delta         = one_hot:1:eq
slot2_used_delta         = one_hot:1:eq
slot3_used_delta         = one_hot:1:eq
slot0_hit_delta          = one_hot:1:eq
