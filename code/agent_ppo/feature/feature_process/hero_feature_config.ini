dist_to_enemy            = min_max:0:116000
in_my_atk_range          = one_hot:1:eq
in_enemy_atk_range       = one_hot:1:eq
hp_rate_diff             = min_max:-1:1
rel_dir_cos              = min_max:-1:1
visible_to_main_camp     = one_hot:1:eq
attack_target_is_enemy   = one_hot:1:eq

# --- Common-attack readiness ---
common_skill_is_useable  = one_hot:1:eq
has_enhanced_common      = one_hot:1:eq
enhanced_stack           = min_max:0:1
enhanced_common_available= one_hot:1:eq

# --- Kiting cues ---
closing_speed            = min_max:-3000:3000
strafe_cos               = min_max:-1:1
