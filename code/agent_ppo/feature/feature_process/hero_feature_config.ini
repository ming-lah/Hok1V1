slot2_hit_delta          = one_hot:1:eq
slot3_hit_delta          = one_hot:1:eq
slot0_recent_hit_rate    = min_max:0:1
slot1_recent_hit_rate    = min_max:0:1
slot2_recent_hit_rate    = min_max:0:1
slot3_recent_hit_rate    = min_max:0:1

# --- Combo / multi-stage window ---
combo_effect_time_max    = min_max:0:120

# --- Tower risk trio ---
in_my_tower_range        = one_hot:1:eq
in_enemy_tower_range     = one_hot:1:eq
under_enemy_tower_fire   = one_hot:1:eq

kill_income   = min_max:0:3000
money_cnt     = min_max:0:40000



