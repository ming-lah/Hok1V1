skill0_usedTimes         = min_max:0:60
skill1_usedTimes         = min_max:0:60
skill2_usedTimes         = min_max:0:60
skill3_usedTimes         = min_max:0:60
skill0_hit_rate          = min_max:0:1
skill1_hit_rate          = min_max:0:1
skill2_hit_rate          = min_max:0:1
skill3_hit_rate          = min_max:0:1

